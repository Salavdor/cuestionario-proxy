<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Curso Escuela de Negocios</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
    --color-negro: #000;
    --color-blanco: #fff;
    --color-primario-1: #174d9c;
    --color-primario-2: #2670e0;
    --color-primario-3: #1d2345;
    --color-primario-4: #00adef;
    --color-secundario-1: #ed475b;
    --color-secundario-2: #9327af;
    --color-secundario-3: #5b5fa5;
    --color-secundario-4: #808aa8;
    --color-secundario-5: #b2cff9;
    --color-secundario-6: rgb(222, 236, 252);

    --titulos-: "Chunkfive";
    --numeros-: "Luminari";
    --texto-: "OpenSans";
}
    body {
      font-family: 'Montserrat', sans-serif;
    }

    h2 {
      color: var(--color-primario-2);
    }
    .title-body-secondary {
      color: var(--color-primario-4);
    }

    #sidebar {
      height: 100vh;
      overflow-y: auto;
      background-color: var(--color-secundario-6);
    }
    #content {
      padding: 20px;
    }
    .subtema {
      cursor: pointer;
    }
.brand {
background: url(src/img/encabezado.jpg);
background-size: cover;
}
    .accordion-button::after {
      display: none !important;
    }
      /* Subtemas */
      .subtema-lista li {
        position: relative;
        padding-left: 1.2rem;
        margin-bottom: 0.5rem;
        cursor: pointer;
        transition: all 0.2s ease-in-out;
        font-weight: 400;
      }
      .subtema-lista li::before {
        content: "•";
        color: var(--color-secundario-3); /* púrpura */
        position: absolute;
        left: 0;
        font-size: 3rem;
        line-height: 0.4;
      }
      .subtema-lista li:hover {
        font-weight: 700;
        color: var(--color-negro);
      }
      .subtema-lista li.active {
        font-weight: 700;
        color: var(--color-negro);
      }
  
      /* Botones del acordeón */
      .accordion-button {
        transition: all 0.2s ease-in-out;
        background-color: var(--color-secundario-5);
        border-radius: 0px 15px 15px 0px !important;
        filter: drop-shadow(3px 3px 5px #00000022);
      }
      .accordion-button:hover {
        background-color: var(--color-primario-2);
        color: var(--color-blanco);
        filter: drop-shadow(3px 3px 5px #00000022);
      }
      .accordion-button:not(.collapsed) {
        background-color: var(--color-primario-2);
        color: var(--color-blanco);
      }
      .accordion-item {
        background-color: #ffffff00;
        border: 0px;
        margin-bottom: 5px;
      }
      .accordion-button:focus {
    box-shadow:none;
}
.encabezado {
  position: relative;
  background: #fff; /* o el color de fondo que uses */
}

.encabezado::before {
  content: "";
    position: absolute;
    right: 0;
    top: 20px;
    bottom: 0;
    width: 40px;
    height: 40px;
    background-color: var(--color-primario-4);
}
.accordion-button.collapsed {
    filter: drop-shadow(3px 3px 5px #00000000);
}
.breadcrumb-item {
    color: var(--color-secundario-4);
}
.breadcrumb-item.active {
    color: var(--color-negro);
}
/* Para botones tabs */
.actividad-btn {
  position: relative;
  font-family: 'Montserrat', sans-serif;
  font-weight: 500;
  margin-bottom: 0.5rem;
  border-color: var(--color-primario-2);
  color: --var(--color-negro);
}
.actividad-btn.active, .actividad-btn:hover {
  background-color: var(--color-primario-4);
  color: --var(--color-negro);
}

.actividad-btn:hover .title-body-secondary,
.actividad-btn:active .title-body-secondary,
.actividad-btn.active .title-body-secondary {
  color: var(--color-blanco);
}

/* Feedback */
#quizFeedback, #tfFeedback {
  font-weight: bold;
}

/* Steps */
.list-group-numbered {
  counter-reset: item;
}
.list-group-numbered .list-group-item::before {
  content: counters(item, ".") ". ";
  counter-increment: item;
  font-weight: bold;
  margin-right: 0.5rem;
}
.form-control {
    font-size: 0.8rem;
    border: 1px solid var(--color-primario-1);
    border-radius: 0% 0% 40px 0%;
}
textarea.form-control {
  resize: vertical; /* permitir redimensionar solo verticalmente */
  font-family: 'Montserrat', sans-serif;
  min-height: calc(7.5em + .75rem + calc(var(--bs-border-width) * 2));
}

.modal-body ul li {
  margin-bottom: 0.5rem;
  font-family: 'Montserrat', sans-serif;
}
.modal-content{
  background-color: var(--color-primario-4);
  color: var(--color-blanco);
}
.btn-close {
    --bs-btn-close-bg: url(data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' fill='#fff'%3e%3cpath d='M.293.293a1 1 0 0 1 1.414 0L8 6.586 14.293.293a1 1 0 1 1 1.414 1.414L9.414 8l6.293 6.293a1 1 0 0 1-1.414 1.414L8 9.414l-6.293 6.293a1 1 0 0 1-1.414-1.414L6.586 8 .293 1.707a1 1 0 0 1 0-1.414z'/%3e%3c/svg%3e) !important;
}

textarea.empty{
  width: 100%;
    background-color: var(--color-secundario-6);
    border: none;
}

.lanzamientoTAB {
  border: 2px solid var(--color-primario-1);
  border-radius: 5px;
}

.feedback-modal {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  padding: 1rem;
  border-radius: 0.5rem;
  background-color: rgba(248, 249, 250, 0.95); /* semi-transparente */
  display: none;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  z-index: 10;
  box-shadow: 0 0.25rem 0.5rem rgba(0,0,0,0.1);
}

.feedback-text {
  text-align: center;
  margin-bottom: 1rem;
}

.feedback-close {
  position: absolute;
  top: 0.25rem;
  right: 0.25rem;
  border: none;
  background: transparent;
  font-size: 1.5rem;
  cursor: pointer;
}

  </style>
</head>
<body>
  <!-- Encabezado -->
<nav class="brand navbar px-3 d-flex justify-content-between align-items-center">
  <div class="d-flex align-items-center">
    <button class="btn btn-outline-light d-md-none me-2" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasMenu">
      ☰
    </button>
    <a class="navbar-brand me-2" href="#">
      <img src="src/img/logoSOFOFA-blanco.png" alt="Logo SOFOFA" style="max-height:40px;" class="img-fluid">
    </a>
    <a class="navbar-brand ms-2" href="#">
      <img src="src/img/logoFACILITADOR-blanco.svg" alt="Logo formacion para el facilitador"  style="height:40px; width:auto; display:block;" class="img-fluid">
    </a>
  </div>

  <div class="d-flex align-items-center">
    <a href="#">
      <img src="src/img/logoSENSE-blanco.svg" alt="Logo sense" style="height:40px; width:auto; display:block;" class="img-fluid">
    </a>
  </div>
</nav>


  <div class="container-fluid">
    <div class="row">
      
      <!-- Sidebar fijo en escritorio -->
      <div id="sidebar" class="col-md-3 d-none d-md-block ps-0 py-3">
        <div id="menuModulos" class="accordion"></div>
      </div>

      <!-- Contenido principal -->
      <div id="content" class="col-md-9 p-0">
        <div class="row m-0 p-3 encabezado">
          <div class="d-flex flex-row-reverse">
            <img src="src/img/logoKWORKS.svg" alt="Modulo1" style="height:30px; width:auto; display:block; padding-right: 19px; margin-top: 12px;" class="img-fluid">
          </div>
          <h2>
            <span class="fw-bold display-2">Módulo 1</span><br>
            <span class="fw-bold title-body-secondary">Las comunidades de práctica (CoP)</span>
          </h2>
        </div>
        <img src="src/img/Modulo1.jpg" alt="Modulo1" class="img-fluid">
      </div>

    </div>
  </div>

  <!-- Sidebar offcanvas en móviles -->
  <div class="offcanvas offcanvas-start" tabindex="-1" id="offcanvasMenu">
    <div class="offcanvas-header">
      <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
    </div>
    <div class="offcanvas-body">
      <div id="menuModulosMobile" class="accordion"></div>
    </div>
  </div>

  <!-- Toast feedback -->
  <div class="position-fixed bottom-0 end-0 p-3" style="z-index: 11">
    <div id="toast" class="toast align-items-center text-bg-primary border-0" role="alert">
      <div class="d-flex">
        <div class="toast-body" id="toastMsg">Contenido cargado</div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>

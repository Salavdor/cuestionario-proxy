/* Steps */
.list-group-numbered {
  counter-reset: item;
}
.list-group-numbered .list-group-item::before {
  content: counters(item, ".") ". ";

  font-weight: bold;
  margin-right: 0.5rem;
}

textarea.form-control {

.feedback-modal {

.feedback-text {

.feedback-close {

}

/* ===================== */
/* Tabla VF personalizada */
/* ===================== */

table.tabla-vf {
  border: 2px solid var(--color-primario-4) !important;   /* borde externo */
  border-collapse: collapse !important; /* colapsar bordes */
  table-layout: fixed !important;       /* ancho fijo */
  width: 100% !important;
}

/* Encabezado azul forzado */
table.tabla-vf thead tr th{
  background-color: var(--color-primario-2) !important;  /* azul */
  color: var(--color-blanco) !important;
  font-weight: bold !important;
  text-align: center !important;
}


/* Ancho fijo de columnas */
table.tabla-vf td th:nth-child(1),
table.tabla-vf td:nth-child(1) {
  width: 50% !important;   /* Pregunta */
}
table.tabla-vf th:nth-child(2),
table.tabla-vf td:nth-child(2),
table.tabla-vf th:nth-child(3),
table.tabla-vf td:nth-child(3) {
  width: 5% !important;   /* V y F */
}
table.tabla-vf th:nth-child(4),
table.tabla-vf td:nth-child(4) {
  width: 40% !important;   /* Retroalimentación */
}

/* Filas intercaladas (zebra) */
table.tabla-vf tbody tr:nth-child(odd) {
  background-color: #ffffff !important; /* blanco */
}
table.tabla-vf tbody tr:nth-child(even) {
  background-color: var(--color-secundario-5) !important; /* gris claro */
}

/* Bordes internos verdes */
table.tabla-vf td, 
table.tabla-vf th {
  border: 2px solid var(--color-primario-4)  !important;
  vertical-align: middle !important;
  text-align: center !important;
}

/* Pregunta alineada a la izquierda */
table.tabla-vf td.text-start {
  text-align: left !important;
}

/* 🔲 Checkbox base en gris claro */
table.tabla-vf .vf-checkbox {
  appearance: none !important;          
  -webkit-appearance: none !important;
  width: 20px !important;
  height: 20px !important;
  border: 2px solid #ccc !important;  /* borde gris claro */
  border-radius: 3px !important;
  cursor: pointer !important;
  position: relative !important;
  background-color: #ffffff3b !important;
}

/* ❌ al marcar */
table.tabla-vf .vf-checkbox:checked::after {
  content: "✘";
  color: red;
  font-weight: bold;
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -55%);
  font-size: 18px;
}



.table>:not(caption)>*>*, .table-striped>tbody>tr:nth-of-type(odd)>* {
  background-color: transparent;
}

.table-striped>tbody>tr:nth-of-type(odd)>* {
    --bs-table-bg-type: transparent;
}



@media (min-width: 1200px) {

 }
